name: neon_xo_admin
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/admin_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/admin_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#100B20"
  adaptive_icon_foreground: "assets/icon/admin_icon.png"